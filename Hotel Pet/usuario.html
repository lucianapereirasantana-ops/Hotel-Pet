
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Usuário</title>
</head>

<body>

    <header>

        <h1>Hotel Pet</h1>

        <nav>
            <a href="reservas.html">Reservas</a>
            <a href="pets.html">Pets</a>
            <a href="usuarios.html">Usuários</a>
            <a href="configuracoes.html">Configurações</a>
            <a href="index.html">Sair</a>
        </nav>

    </header>

    <main>

        <h2>Informações do Usuário</h2>

        <section>

            <h3>Dados do usuário</h3>

            <form>

                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" value="Maria Silva">

                <br><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" value="maria@email.com">

                <br><br>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" value="(73) 99999-9999">

                <br><br>

                <label for="funcao">Função:</label>

                <select id="funcao" name="funcao">

                    <option value="cliente" selected>Cliente</option>
                    <option value="funcionario">Funcionário</option>
                    <option value="gerente">Gerente</option>

                </select>

                <br><br>

                <label for="status">Status:</label>

                <select id="status" name="status">

                    <option value="ativo" selected>Ativo</option>
                    <option value="inativo">Inativo</option>

                </select>

                <br><br>

                <button type="submit">Salvar alterações</button>

            </form>

        </section>

        <section>

            <h3>Ações do usuário</h3>

            <button type="button">Alterar status</button>

            <button type="button">Excluir usuário</button>

        </section>

        <br>

        <a href="usuarios.html">Voltar para Usuários</a>

    </main>

    <footer>

        <p>&copy; 2026 Hotel Pet</p>

    </footer>

</body>

</html>

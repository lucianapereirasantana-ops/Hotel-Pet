
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Configurações</title>
</head>

<body>

    <header>

        <h1>Hotel Pet</h1>

        <nav>
            <a href="reservas.html">Reservas</a>
            <a href="pets.html">Pets</a>
            <a href="usuarios.html">Usuários</a>
            <a href="configuracoes.html">Configurações</a>
            <a href="index.html">Sair</a>
        </nav>

    </header>

    <main>

        <h2>Configurações</h2>

        <section>

            <h3>Configurações das diárias</h3>

            <form>

                <label for="valor_diaria">Valor da diária:</label>
                <input
                    type="number"
                    id="valor_diaria"
                    name="valor_diaria"
                    value="50"
                    step="0.01"
                >

                <br><br>

                <button type="submit">Salvar valor da diária</button>

            </form>

        </section>

        <section>

            <h3>Configurações de vagas</h3>

            <form>

                <label for="vagas">Número de vagas disponíveis:</label>

                <input
                    type="number"
                    id="vagas"
                    name="vagas"
                    value="20"
                    min="0"
                >

                <br><br>

                <button type="submit">Salvar número de vagas</button>

            </form>

        </section>

        <br>

        <a href="reservas.html">Voltar para Reservas</a>

    </main>

    <footer>

        <p>&copy; 2026 Hotel Pet</p>

    </footer>

</body>

</html>
